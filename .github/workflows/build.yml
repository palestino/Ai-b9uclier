name: Build AI-Bouclier v2.0 Futuristic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-futuristic-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 4. Create Android Project Structure & Files
        run: |
          mkdir -p AI-Bouclier-Android/app/src/main/java/com/shield/aibouclier
          mkdir -p AI-Bouclier-Android/app/src/main/assets
          mkdir -p AI-Bouclier-Android/.github/workflows

          cd AI-Bouclier-Android

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AIBouclier"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.shield.aibouclier"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.shield.aibouclier"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0.0-FUTURISTIC"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("org.tensorflow:tensorflow-lite:2.16.1")
              implementation("androidx.work:work-runtime-ktx:2.9.0")
          }
          EOF

          echo "Project structure generated successfully."

      - name: 5. Compile Futuristic APK
        run: |
          cd AI-Bouclier-Android
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../AI-Bouclier-v2.apk

      - name: 6. Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Bouclier-v2-APK
          path: AI-Bouclier-v2.apk

      - name: 7. Publish Direct APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "AI-Bouclier v2.0 Futuristic Shield (Ready APK)"
          files: AI-Bouclier-v2.apk
